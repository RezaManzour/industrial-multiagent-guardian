[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src", "eval"]

[tool.ruff.lint.per-file-ignores]
# Streamlit runs this file as a script, so it puts the repo root on
# sys.path before importing src.
"src/dashboard.py" = ["E402"]
